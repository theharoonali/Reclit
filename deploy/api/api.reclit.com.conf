# nginx site for the API (docs/DEPLOYMENT.md). Installed to
# /etc/nginx/conf.d/api.reclit.com.conf; certbot adds the 443 server block
# and the HTTP → HTTPS redirect to this file.
upstream reclit_api {
    server 127.0.0.1:4001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.reclit.com;

    # Uploads (POST /files, imports, onboarding) go up to 15 MB per file.
    client_max_body_size 25m;

    location / {
        proxy_pass http://reclit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # tRPC subscriptions are Server-Sent Events: never buffer them, and
        # keep the stream open between the 15 s pings.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

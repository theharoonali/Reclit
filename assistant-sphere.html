<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reclit — assistant cube</title>
    <style>
      :root {
        color-scheme: light;
        --bg: hsl(0 0% 100%);
        --ink: hsl(0 0% 11%);
        --muted: hsl(0 0% 42%);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .stage {
        width: min(70vmin, 28rem);
        aspect-ratio: 1;
      }
      canvas { display: block; width: 100%; height: 100%; }
      p {
        margin: 0;
        font-size: 0.875rem;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage" id="stage">
        <canvas id="orb" aria-hidden="true"></canvas>
      </div>
      <p>Reclit AI</p>
    </main>
    <script>
      const TEMPO = 1;
      const STILL_TIME = 1.15;
      const SPEED = 1.82 * 0.8;
      const ICON_PX = 28;

      function layerOf(coord) {
        if (coord < -0.24) return -1;
        if (coord > 0.24) return 1;
        return 0;
      }

      const MOVES = [];
      for (let axis = 0; axis < 3; axis++) {
        for (const layer of [-1, 0, 1]) {
          MOVES.push({
            axis,
            layer,
            ang: (layer === 0 ? -1 : 1) * (Math.PI / 2),
          });
        }
      }

      function fieldFor(size) {
        const density = Math.sqrt(0.35) * (size / ICON_PX);
        const sizeMul = 1.05;
        return {
          latRings: Math.max(2, Math.round(15 * density)),
          lonDensity: Math.max(2, Math.round(40 * density)),
          rBase: 0.6 * sizeMul,
          rDepth: 1.7 * sizeMul,
          rActive: 0.3 * sizeMul,
          inkFar: 0.62,
          inkSpan: 0.54,
          rsPow: 0.6,
          rMin: 0.3,
        };
      }

      function project(yaw, pitch, size) {
        const sp = Math.sin(pitch);
        const cp = Math.cos(pitch);
        const sy = Math.sin(yaw);
        const cy = Math.cos(yaw);
        const ox = size / 2;
        const oy = size / 2;
        const scale = (size / 2) * 0.82;
        return (x, y, z) => {
          const u = -x * sy + z * cy;
          return [
            ox + (x * cy + z * sy) * scale,
            oy - (y * cp - u * sp) * scale,
            y * sp + u * cp,
          ];
        };
      }

      function twist(time, count) {
        const span = 2 * count * 0.42 + 1.2;
        const t = time % span;
        const amount = Array.from({ length: count }, () => 0);
        let active = -1;
        if (t < 2 * count * 0.42) {
          const step = Math.floor(t / 0.42);
          const p = Math.min(1, (t - 0.42 * step) / 0.42 / 0.7);
          const eased = 1 - (1 - p) ** 3;
          if (step < count) {
            for (let j = 0; j < step; j++) amount[j] = 1;
            amount[step] = eased;
            active = step;
          } else {
            const back = 2 * count - 1 - step;
            for (let k = 0; k < back; k++) amount[k] = 1;
            amount[back] = 1 - eased;
            active = back;
          }
        }
        return { amount, active };
      }

      function turn(point, cubes, state) {
        let x = point[0];
        let y = point[1];
        let z = point[2];
        let hot = false;
        for (let i = 0; i < cubes.length; i++) {
          const amount = state.amount[i] ?? 0;
          if (amount <= 0) continue;
          const move = cubes[i];
          if (!move) continue;
          const coord = move.axis === 0 ? x : move.axis === 1 ? y : z;
          if (layerOf(coord) !== move.layer) continue;
          if (i === state.active) hot = true;
          const ang = move.ang * amount;
          const c = Math.cos(ang);
          const s = Math.sin(ang);
          if (move.axis === 0) {
            const nx = y * c - z * s;
            z = y * s + z * c;
            y = nx;
          } else if (move.axis === 1) {
            const nx = x * c + z * s;
            z = -x * s + z * c;
            x = nx;
          } else {
            const nx = x * c - y * s;
            y = x * s + y * c;
            x = nx;
          }
        }
        return [x, y, z, hot];
      }

      function turnWith(point, anchor, cubes, state) {
        let x = point[0];
        let y = point[1];
        let z = point[2];
        let ax = anchor[0];
        let ay = anchor[1];
        let az = anchor[2];
        let hot = false;
        for (let i = 0; i < cubes.length; i++) {
          const amount = state.amount[i] ?? 0;
          if (amount <= 0) continue;
          const move = cubes[i];
          if (!move) continue;
          const coord = move.axis === 0 ? ax : move.axis === 1 ? ay : az;
          if (layerOf(coord) !== move.layer) continue;
          if (i === state.active) hot = true;
          const ang = move.ang * amount;
          const c = Math.cos(ang);
          const s = Math.sin(ang);
          const spin = (px, py, pz) => {
            if (move.axis === 0) return [px, py * c - pz * s, py * s + pz * c];
            if (move.axis === 1) return [px * c + pz * s, py, -px * s + pz * c];
            return [px * c - py * s, px * s + py * c, pz];
          };
          const spun = spin(x, y, z);
          x = spun[0];
          y = spun[1];
          z = spun[2];
          const asp = spin(ax, ay, az);
          ax = asp[0];
          ay = asp[1];
          az = asp[2];
        }
        return [x, y, z, hot];
      }

      function rubik(size, time, field) {
        const yaw = 0.7 + 0.55 * time;
        const pitch = 0.5 + 0.08 * Math.sin(0.9 * time);
        const cam = project(yaw, pitch, size);
        const toward = [
          -Math.sin(yaw) * Math.cos(pitch),
          Math.sin(pitch),
          Math.cos(yaw) * Math.cos(pitch),
        ];
        const state = twist(time, MOVES.length);
        const stickers = [];
        const cells = 3;
        const cube = 0.72;
        const cell = (2 * cube) / cells;
        const halfSticker = (cell * 0.92) / 2;
        for (let axis = 0; axis < 3; axis++) {
          for (let face = 0; face < 2; face++) {
            for (let i = 0; i < cells; i++) {
              for (let j = 0; j < cells; j++) {
                const center = [0, 0, 0];
                center[axis] = face === 0 ? -cube : cube;
                center[(axis + 1) % 3] = -cube + cell * (i + 0.5);
                center[(axis + 2) % 3] = -cube + cell * (j + 0.5);
                const corners = [];
                for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
                  const corner = center.slice();
                  corner[(axis + 1) % 3] += su * halfSticker;
                  corner[(axis + 2) % 3] += sv * halfSticker;
                  const spun = turnWith(corner, center, MOVES, state);
                  corners.push(cam(spun[0], spun[1], spun[2]));
                }
                const mid = turn(center, MOVES, state);
                const outward = [0, 0, 0];
                outward[axis] = face === 0 ? -1 : 1;
                const turned = turnWith(
                  [center[0] + outward[0], center[1] + outward[1], center[2] + outward[2]],
                  center,
                  MOVES,
                  state,
                );
                const facing =
                  (turned[0] - mid[0]) * toward[0] +
                  (turned[1] - mid[1]) * toward[1] +
                  (turned[2] - mid[2]) * toward[2];
                if (facing <= 0) continue;
                const p = cam(mid[0], mid[1], mid[2]);
                const bit = axis * 18 + face * 9 + i * 3 + j;
                stickers.push({
                  corners,
                  z: p[2],
                  white: 0.16 + ((bit * 19) % 54) / 53 * 0.7,
                });
              }
            }
          }
        }
        stickers.sort((a, b) => a.z - b.z);
        return stickers;
      }

      function paint(ctx, width, height, time) {
        const size = Math.min(width, height);
        ctx.clearRect(0, 0, width, height);
        if (size <= 0) return;
        // Same 28px header field, drawn larger. The points sit on a cube.
        const zoom = size / ICON_PX;
        const stickers = rubik(ICON_PX, time, fieldFor(ICON_PX));
        const ox = (width - size) / 2;
        const oy = (height - size) / 2;
        for (const sticker of stickers) {
          const g = Math.round(Math.min(1, Math.max(0, sticker.white)) * 255);
          ctx.fillStyle = "rgba(" + g + "," + g + "," + g + ",1)";
          ctx.beginPath();
          sticker.corners.forEach((corner, index) => {
            const x = ox + corner[0] * zoom;
            const y = oy + corner[1] * zoom;
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.closePath();
          ctx.fill();
        }
      }

      const stage = document.getElementById("stage");
      const canvas = document.getElementById("orb");
      const ctx = canvas.getContext("2d");
      let time = 0;
      let last = 0;
      let frame = null;

      function measure() {
        const dpr = window.devicePixelRatio || 1;
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        const backingW = Math.max(1, Math.round(width * dpr));
        const backingH = Math.max(1, Math.round(height * dpr));
        if (canvas.width !== backingW || canvas.height !== backingH) {
          canvas.width = backingW;
          canvas.height = backingH;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paint(ctx, width, height, time * SPEED);
      }

      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
      const shouldAnimate = () => !document.hidden && !reduced.matches;

      function tick(now) {
        frame = null;
        const dt = last ? (now - last) / 1000 : 0;
        last = now;
        time += TEMPO * dt;
        const dpr = window.devicePixelRatio || 1;
        paint(ctx, canvas.width / dpr, canvas.height / dpr, time * SPEED);
        if (shouldAnimate()) frame = requestAnimationFrame(tick);
      }

      function sync() {
        if (shouldAnimate()) {
          last = 0;
          if (frame === null) frame = requestAnimationFrame(tick);
        } else {
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
          if (reduced.matches) time = STILL_TIME;
          measure();
        }
      }

      new ResizeObserver(measure).observe(stage);
      measure();
      sync();
      document.addEventListener("visibilitychange", sync);
      reduced.addEventListener("change", sync);
    </script>
  </body>
</html>
